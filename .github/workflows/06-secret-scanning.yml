name: "Secret Scanning & Protection"

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: Scan for Secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog - Detect secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

      - name: Detect secrets with GitGuardian
        uses: GitGuardian/ggshield-action@master
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        continue-on-error: true

  credential-check:
    runs-on: ubuntu-latest
    name: Check for Credentials
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets with detect-secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline --update .secrets.baseline || true
          detect-secrets audit .secrets.baseline || true
        continue-on-error: true

      - name: Check environment files
        run: |
          echo "Checking for .env files..."
          if find . -name ".env*" -type f ! -path "./.git/*" ! -path "./node_modules/*"; then
            echo "⚠️ WARNING: Found .env files that might contain secrets!"
            exit 0
          fi
